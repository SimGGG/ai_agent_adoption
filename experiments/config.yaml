# 확정 사항을 담는 설정. 값의 근거는 docs/decisions.md와 설계 문서 2장, 6.7절에 있다.
data:
  years: [2023, 2024, 2025, 2026]          # 결정 23
  codebook: data/postings/ojp_codebook_skill.csv
  ksic: data/postings/KSIC10.xlsx
  keco: data/postings/KECO2025.xlsx
  ked_firm: data/ked/KED5002.txt
  aiie: "data/external/aioe/Language Modeling AIOE and AIIE.xlsx"   # 결정 30
  naics_isic: data/external/census/2017_NAICS_to_ISIC_4.xlsx
  ksic_isic: experiments/crosswalks/ksic10_sub_to_isic4.csv   # 판단으로 만든 표. git으로 관리

period:                                    # 결정 23, 24, 25
  start: "2023-01-01"
  end: "2026-08-31"
  unit: year
  date_columns: [post_start, post_end]     # 앞의 열이 비어 있으면 다음 열을 게시일로 쓴다
  fill:                                    # 결정 38
    enabled: true                          # 두 날짜가 모두 없는 공고에 같은 파일의 바로 앞 공고 날짜를 쓴다
    max_gap_days: null                     # 결정 43: 한도를 두지 않는다. 값을 주면, 날짜를 채운 공고 가운데 앞뒤 날짜의 간격이 이 일수보다 크거나 뒤에 날짜가 없는 공고를 분석 기간 단계에서 뺀다
  groups:
    - {name: "초기", years: [2023, 2024]}
    - {name: "1 도입기", years: [2025]}
    - {name: "2 도입기", years: [2026]}

occupations:                               # 결정 20, 26, 27, 39
  min_use_postings: 30
  exclude_keco2: ["01", "61", "21", "41"]  # 결정 39: 교육직(21), 예술·디자인·방송직(41)도 뺀다
  group_min_treated: 100
  keco4: ["0241", "0243", "0261", "0262", "0265", "0271", "0272", "0284", "0292", "0295",
          "0299", "1320", "1331", "1332", "1333", "1339", "1342", "1351", "1352", "1361"]

industry:
  not_in_table: missing                    # 결정 28. category | missing

region:
  merge_sido:                              # 결정 29
    "광주·전남": ["광주", "전남", "전남광주"]

sample:
  require_bzno: true         # 6.7절 1번 기본값(결정 33)

treatment:
  text_columns: [detail]     # 6.7절 2번 기본값(결정 33): 본문만
  keywords:                  # proposal.md 3.2절의 예시와 저자가 더한 표현(결정 22, 32)
    strict: ['AI\s*agent', 'AI\s*에이전트', 'agentic', '에이전틱', 'LLM\s*agent', '멀티\s*에이전트', 'multi[- ]?agent']
    broad_extra: ['자율\s*에이전트', '에이전트\s*오케스트레이션', 'LangChain', 'LangGraph', 'AutoGen', 'CrewAI',
                  'Claude', '클로드', 'Codex', '코덱스', 'Ollama', '올라마', 'Gemini', '제미나이',
                  'Deep\s*seek', '딥\s*시크', 'sub[- ]?agent', '서브\s*에이전트']
    exclude: ['보험\s*에이전트', '여행\s*에이전[트시]', '부동산\s*에이전트', '스포츠\s*에이전트', '에이전시']
    # 생성형 AI 활용 표현(결정 36, 41). 걸린 공고는 처치 정의 `use_any`에서 처치 공고이고, 어떤 정의에서도 비교 공고가 아니다
    use: [
          # 일반 표현
          'Chat\s*GPT', '챗\s*GPT', '챗\s*지피티', 'GPT', '생성형\s*AI', '생성형\s*인공지능', '생성\s*AI', 'Generative\s*AI',
          '(?<![A-Za-z])Gen\s?AI', '프롬프트\s*엔지니어', '프롬프트\s*(?:작성|설계|활용|디자인)', 'prompt\s*engineer',
          '(?<![A-Za-z])LLMs?(?![A-Za-z])', '대규모\s*언어\s*모델', '거대\s*언어\s*모델', '초거대\s*AI',
          'Copilot', '코파일럿', 'Midjourney', '미드저니', 'Stable\s*Diffusion', '스테이블\s*디퓨전',
          'Claude', 'Gemini', '제미나이', 'Perplexity', '퍼플렉시티', '뤼튼', 'HyperCLOVA', '하이퍼클로바', '클로바\s*X',
          'Notion\s*AI|노션\s*AI', '(?<![A-Za-z])AI\s*(?:툴|도구)', '(?<![A-Za-z])AI\s*활용',
          # 결정 41에서 더한 표현: 대화형 서비스와 언어 모형
          '(?<![A-Za-z])sLLM(?![A-Za-z])', '클로드', '(?<![A-Za-z])Codex(?![A-Za-z])(?!\s*(?:Alimentarius|규격|기준|위원회))',
          '코덱스(?!\s*(?:규격|기준|위원회))', 'Deep\s*Seek', '딥\s*시크', '(?<![A-Za-z])Grok(?![A-Za-z])', '그록',
          '(?<![A-Za-z])Llama(?![A-Za-z])', 'Mistral|미스트랄', '(?<![A-Za-z])Qwen', 'Google\s*Bard|구글\s*바드',
          'Bing\s*(?:Chat|AI)|빙\s*챗', 'NotebookLM|노트북\s*LM', 'Genspark|젠스파크', 'Manus\s*AI|마누스',
          # 국내 서비스와 모형. `에이닷`은 결정 44에서 뺐다
          '(?<![A-Za-z])wrtn(?![A-Za-z])', '(?<![A-Za-z])Kanana|카나나', 'EXAONE|엑사원', 'CLOVA\s*X',
          # 이미지·영상·음성 생성
          '(?<![A-Za-z])DALL[-·\s]?E(?![A-Za-z])', '(?<![A-Za-z])Firefly(?![A-Za-z])|파이어플라이', 'ComfyUI|컴피\s*UI',
          'Nano\s*Banana|나노\s*바나나', '(?<![A-Za-z])Sora(?![A-Za-z])', '(?<![A-Za-z])Veo\s?\d',
          '(?<![A-Za-z])Kling(?![A-Za-z])|(?<![가-힣])클링\s*AI', 'Runway\s*(?:ML|Gen|AI)|런웨이\s*(?:ML|AI)',
          'Pika\s*(?:Labs|AI)|피카\s*랩스', 'Higgsfield|힉스필드', '(?<![A-Za-z])Suno(?![A-Za-z])|수노\s*AI',
          'ElevenLabs|일레븐\s*랩스', '(?<![A-Za-z])Vrew(?![A-Za-z])', '(?<![A-Za-z])Gamma\s*AI|감마\s*AI',
          # 코드 작성 도구
          'Cursor\s*(?:AI|IDE)|커서\s*AI', 'Windsurf(?!ing)|윈드서프']
  agent_skills:              # 결정 13, 19
    v31_prefix: "IT-06-012-"
    use_suffix: "활용하기"
    move_to_dev: ["IT-05-0382", "IT-05-0413", "IT-05-0414", "IT-05-0420", "IT-05-0421"]
    move_to_use: ["IT-05-0396"]
  definition: use_any        # 결정 40. all | dev | use | keyword | code | use_keyword | use_any
  keyword_dictionary: strict

skills:
  # 결정 45: 후보 56개 가운데 희소 필터를 통과한 3개(데이터 엔지니어링 수행하기, 데이터 파이프라인 구축하기, 빅데이터 분석하기)
  adjacent: ["IT-05-0358", "IT-05-0359", "IT-05-0360"]
  adjacent_candidate_details: ["MLOps및AI인프라", "로봇및자율시스템"]   # 설계 문서 6.7절 3번의 후보
  # 결정 46: 추정 결과를 보기 전에 정했다. 자격·학위·어학은 넣지 않고 "~하기" 형태의 숙련만 넣는다. 추정 결과를 본 뒤에는 바꾸지 않는다
  placebo: [
    # 물류·재고 작업
    "CW-03-0034",   # 재고 관리하기
    "CW-03-0032",   # 창고 입출고하기
    "CW-03-0023",   # 자재 관리하기
    "CW-03-0100",   # 물류 관리하기
    "CW-03-0155",   # 출고 관리하기
    "CW-03-0166",   # 수발주하기
    "CW-03-0157",   # 제품 출고관리하기
    "CW-03-0083",   # 자재 구매하기
    "CW-03-0048",   # 납기 관리하기
    "CW-03-0129",   # 핸들링하기
    "CW-03-0133",   # 홈쇼핑 물류 관리하기
    "CW-03-0152",   # 쇼핑몰 상품 포장하기
    "CW-03-0030",   # 재고 실사하기
    "CW-03-0125",   # 포워딩하기
    "CW-03-0027",   # 하역 및 운영하기
    # 생산·품질 관리와 기구·회로 설계
    "PR-03-0130",   # 품질 관리하기
    "PR-01-0104",   # 생산관리 지원하기
    "PR-02-0184",   # 기구 설계하기
    "PR-04-0233",   # 전기 회로 설계하기
    "PR-04-0228",   # PCB 설계하기
    "PR-04-0337",   # 전자회로 설계하기
  ]
  placebo_candidate_domains: ["건설·현장·이동 작업", "생산·제조·정비", "돌봄·서비스·공공", "자격·인증"]
  sparse_filter:                           # 결정 32
    min_rate: 0.001
    min_treated: 30

salary_band_edges: [26000000, 30000000, 35000000, 40000000]   # 결정 31. 단위는 원
occ_group: keco2             # 6.7절 9번 기본값(결정 33)

estimation:
  seed: 42
  n_folds: 5
  trim: [0.01, 0.99]
  lgbm: {n_estimators: 300, learning_rate: 0.05, num_leaves: 31}
